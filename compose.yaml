services:
  tradegoldandsilver-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradegoldandsilver:2026-09-25
    container_name: tradegoldandsilver-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      VIRTUAL_HOST: tradegoldandsilver.online,www.tradegoldandsilver.online
      LETSENCRYPT_HOST: tradegoldandsilver.online,www.tradegoldandsilver.online
      LETSENCRYPT_EMAIL: admin@tradegoldandsilver.online
      VIRTUAL_PORT: "3000"
      VIRTUAL_NETWORK: tradegoldandsilver-proxy
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - tradegoldandsilver-proxy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tradegoldandsilver-proxy:
    external: true
    name: tradegoldandsilver-proxy
